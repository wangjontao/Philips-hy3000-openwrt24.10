name: HY3000 open mt76
on:
  workflow_dispatch:
  push:
    branches: [ "codex/hy3000-open-mt76" ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-hy3000-nps <<'EOF'
#!/bin/sh
MAC=$(ip link show wan 2>/dev/null | awk '/link\/ether/{print $2}' | tr -d ':')
[ -n "$MAC" ] && uci -q set nps.@nps[0].server='47.83.9.208' && uci -q set nps.@nps[0].vkey="$MAC" && uci -q commit nps
exit 0
EOF
          chmod +x files/etc/uci-defaults/99-hy3000-nps
          cat > .config <<'EOF'
CONFIG_TARGET_mediatek=y
CONFIG_TARGET_mediatek_filogic=y
CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y
CONFIG_PACKAGE_luci=y
CONFIG_PACKAGE_luci-ssl=y
CONFIG_PACKAGE_luci-app-ttyd=y
CONFIG_PACKAGE_luci-theme-argon=y
CONFIG_PACKAGE_luci-app-nps=y
CONFIG_PACKAGE_kmod-mt7915e=y
CONFIG_PACKAGE_kmod-mt7981-firmware=y
CONFIG_PACKAGE_mt7981-wo-firmware=y
CONFIG_PACKAGE_kmod-fs-f2fs=y
CONFIG_PACKAGE_kmod-mmc=y
CONFIG_PACKAGE_fdisk=y
EOF
          make defconfig
      - name: Build
        run: |
          rm -rf dl/go-mod-cache
          make download -j2 V=s
          make -j2 V=s
      - uses: actions/upload-artifact@v4
        with:
          name: Philips-HY3000-open-mt76
          path: bin/targets/mediatek/filogic/*
