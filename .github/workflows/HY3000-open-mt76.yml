name: HY3000 source defaults
on:
  workflow_dispatch:
  push:
    branches: ["codex/hy3000-open-mt76"]
    paths: [".github/workflows/HY3000-open-mt76.yml"]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl swig
          df -h
      - name: Configure HY3000 with source defaults
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          printf '%s\n' 'CONFIG_TARGET_mediatek=y' 'CONFIG_TARGET_mediatek_filogic=y' 'CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y' 'CONFIG_PACKAGE_luci=y' > .config
          make defconfig
          grep -qx 'CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y' .config
          grep -qx 'CONFIG_PACKAGE_kmod-mt7915e=y' .config
          ./scripts/diffconfig.sh > hy3000.config
          git rev-parse HEAD > source-commit.txt
      - name: Download sources
        run: make download -j2 V=s
      - name: Compile
        run: make -j2 V=s
      - name: Verify firmware
        run: |
          mkdir -p upload
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*hy3000*sysupgrade*' -size +1M -exec cp {} upload/ \;
          test -n "$(find upload -type f -name '*sysupgrade*' -print -quit)"
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.manifest' -exec cp {} upload/ \;
          grep -q '^kmod-mt7915e ' upload/*.manifest
          cp hy3000.config source-commit.txt upload/
          cd upload
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: HY3000-source-defaults
          path: upload/*
          if-no-files-found: error
      - name: Save diagnostic configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HY3000-build-config
          path: hy3000.config
