name: HY3000 open mt76
on:
  workflow_dispatch:
  push:
    branches: [ "codex/**" ]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          mkdir -p files/etc/uci-defaults
          printf '%s
' '#!/bin/sh' 'MAC=$(ip link show wan 2>/dev/null | awk "/link\\/ether/{print \$2}" | tr -d ":")' '[ -n "$MAC" ] && uci -q set nps.@nps[0].server=47.83.9.208 && uci -q set nps.@nps[0].vkey="$MAC" && uci -q commit nps' 'exit 0' > files/etc/uci-defaults/99-hy3000-nps
          chmod +x files/etc/uci-defaults/99-hy3000-nps
          echo CONFIG_TARGET_mediatek=y > .config
          echo CONFIG_TARGET_mediatek_filogic=y >> .config
          echo CONFIG_TARGET_mediatek_filogic_DEVICE_philips_hy3000=y >> .config
          echo CONFIG_PACKAGE_luci=y >> .config
          echo CONFIG_PACKAGE_luci-ssl=y >> .config
          echo CONFIG_PACKAGE_luci-app-ttyd=y >> .config
          echo CONFIG_PACKAGE_luci-theme-argon=y >> .config
          echo CONFIG_PACKAGE_luci-app-nps=y >> .config
          echo CONFIG_PACKAGE_kmod-mt7915e=y >> .config
          echo CONFIG_PACKAGE_kmod-mt7981-firmware=y >> .config
          echo CONFIG_PACKAGE_mt7981-wo-firmware=y >> .config
          echo CONFIG_PACKAGE_luci-app-passwall=y >> .config
          echo CONFIG_PACKAGE_luci-app-passwall2=y >> .config
          echo CONFIG_PACKAGE_luci-app-homeproxy=y >> .config
          make defconfig
      - run: |
          rm -rf dl/go-mod-cache
          make download -j$(nproc) V=s
          make -j$(nproc) V=s
      - uses: actions/upload-artifact@v4
        with:
          name: Philips-HY3000-open-mt76
          path: bin/targets/mediatek/filogic/*
