name: HY3000 DulWiFi mt76 full
on:
  workflow_dispatch:
  push:
    branches: [codex/hy3000-dulwifi-custom]
    paths: [custom/**, .github/workflows/HY3000-custom.yml]
permissions:
  contents: read
concurrency:
  group: hy3000-mt76-custom
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib gettext git libncurses-dev libssl-dev python3-setuptools rsync unzip zlib1g-dev file wget curl swig openssl jq
          df -h
      - name: Prepare packages and validate configuration
        run: |
          bash -n custom/prepare.sh
          sh -n custom/files/etc/uci-defaults/99-dulwifi
          sh -n custom/files/etc/init.d/dulwifi-firstboot
          sh -n custom/files/usr/libexec/dulwifi-firstboot
          bash custom/prepare.sh
      - name: Download
        run: make download -j2 V=s
      - name: Compile
        run: |
          set -o pipefail
          make -j2 V=s 2>&1 | tee build.log
      - name: Verify image and installed packages
        run: |
          set -euo pipefail
          mkdir -p upload
          find bin/targets/mediatek/filogic -maxdepth 1 -name '*hy3000*sysupgrade*' -type f -size +1M -exec cp {} upload/ \;
          test -n "$(find upload -type f -name '*sysupgrade*' -print -quit)"
          find bin/targets/mediatek/filogic -maxdepth 1 -type f -name '*.manifest' -exec cp {} upload/ \;
          for pkg in kmod-mt7915e luci-app-store luci-app-quickstart quickstart luci-app-ttyd luci-theme-argon luci-app-passwall luci-app-passwall2 luci-app-homeproxy luci-app-openclash luci-app-nps npc sing-box xray-core; do
            grep -q "^$pkg " upload/*.manifest || { echo "Missing package: $pkg"; exit 1; }
          done
          grep -Eq '^luci-app-passwall - 26\.3\.6-1$' upload/*.manifest
          grep -Eq '^luci-app-passwall2 - 26\.3\.5-1$' upload/*.manifest
          cp hy3000.config source-lock.txt upload/
          git rev-parse HEAD > upload/source-commit.txt
          cd upload
          sha256sum * > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: HY3000-DulWiFi-mt76-full
          path: upload/*
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HY3000-custom-diagnostics
          path: |
            hy3000.config
            source-lock.txt
            build.log
